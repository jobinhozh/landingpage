version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      astro: { patterns: ["astro", "@astrojs/*"] }
      cloudflare: { patterns: ["wrangler", "@cloudflare/*"] }
      tailwind: { patterns: ["tailwindcss", "@tailwindcss/*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
